<style>
*{box-sizing:border-box}

}

<body>
<canvas id="world"></canvas>
<div id="grain" class="fx"></div><div id="vignette" class="fx"></div><div id="letterbox" class="fx"></div><div id="ink" class="fx"></div>
<div id="intro"><div class="introbox"><div class="kicker">南宋 · 刘过</div><h1>少年游</h1><div class="sub">唐多令 · 芦叶满汀洲</div><button id="enter" class="enter">入 画</button></div></div>
<div id="copy"><div id="caption" class="caption"></div></div>
<div id="chapter">江上初见</div><button id="sound">声音开启</button><div id="progress"></div><div id="seal">少年游</div>
<script>
const cv=document.querySelector('#world'),ctx=cv.getContext('2d'),caption=document.querySelector('#caption'),intro=document.querySelector('#intro'),ink=document.querySelector('#ink'),chapter=document.querySelector('#chapter'),soundBtn=document.querySelector('#sound'),progress=document.querySelector('#progress'),seal=document.querySelector('#seal');
let W,H,D,started=false,t0=0,lastCap=-1,lastVoice=-1,lastScene=-1,muted=false,audioCtx=null,ambGain=null,riseStarted=false;
const clamp=(v,a=0,b=1)=>Math.max(a,Math.min(b,v)),smooth=(a,b,t)=>{let x=clamp((t-a)/(b-a));return x*x*(3-2*x)},rand=(a,b)=>a+Math.random()*(b-a),bell=(t,c,w)=>Math.exp(-Math.pow((t-c)/w,2));
function resize(){W=innerWidth;H=innerHeight;D=Math.min(devicePixelRatio||1,2);cv.width=W*D;cv.height=H*D;ctx.setTransform(D,0,0,D,0,0)}addEventListener('resize',resize);resize();
const stars=Array.from({length:65},()=>({x:Math.random(),y:Math.random()*.45,a:rand(.05,.32),r:rand(.4,1.15)}));

const petals=Array.from({length:34},()=>({x:Math.random(),y:Math.random(),p:rand(0,9),s:rand(.6,1.5)}));
const voices=['01_twenty_years.mp3','02_river.mp3','03_reeds.mp3','04_south_tower.mp3','05_willow.mp3','06_return.mp3','07_truth.mp3','08_rock.mp3','09_oldfriend.mp3','10_new_sorrow.mp3','11_wine.mp3','12_not_same.mp3','13_youth.mp3','14_epilogue.mp3'].map(n=>{const a=new Audio('assets/audio/'+n);a.preload='auto';return a});
const music={intro:new Audio('assets/audio/bgm_intro.mp3'),memory:new Audio('assets/audio/bgm_memory.mp3'),rise:new Audio('assets/audio/bgm_rise.mp3')};Object.values(music).forEach(a=>{a.preload='auto';a.loop=true;a.volume=0});
const voiceTimes=[0,5.4,16.4,22.2,28,35.4,43.2,53,57.3,63.4,72.3,83,90.5,102.3];
const caps=[
[0,'left narration','二十年……<br>可以改变多少事。'],
[5.4,'left narration','一个人，从少年走到暮色。<br>一座城，换了人间。<span class="whisper">可江水……仍旧这样流。</span>'],
[16.4,'center poem','芦叶满汀洲，<br>寒沙带浅流。'],
[22.2,'right poem vertical','二十年重过南楼。'],
[28,'center poem','柳下系船犹未稳，<br>能几日，又中秋。'],
[35.4,'left narration','我们总以为，回到旧地，<br>就能把从前，也一并找回来。'],
[43.2,'right narration','后来才知道——<br>故地，可以重游。<span class="whisper">故人……却未必还在。</span>'],

[57.3,'center poem','故人今在否？'],
[63.4,'right poem vertical','旧江山浑是新愁。'],
[72.3,'center poem','欲买桂花同载酒。'],
[83,'center poem','终不似……'],
[90.5,'center poem','少年游。'],
[102.3,'center narration','场景还在。<br>人生，却早已走远了。']

const scenes=[
{start:0,end:15,title:'江上初见',fn:shotRiver},
{start:15,end:21.5,title:'芦洲寒水',fn:shotReeds},
{start:21.5,end:27.5,title:'重过南楼',fn:shotTower},
{start:27.5,end:35,title:'柳下系舟',fn:shotMooring},
{start:35,end:50,title:'旧梦回潮',fn:shotMemory},
{start:50,end:61.5,title:'黄鹤断矶',fn:shotRuin},
{start:61.5,end:71,title:'旧江山',fn:shotLandscape},
{start:71,end:82,title:'桂花载酒',fn:shotWine},
{start:82,end:90,title:'终不似',fn:shotGhost},
{start:90,end:101.5,title:'少年游',fn:shotDeparture},
{start:101.5,end:115,title:'余音',fn:shotAfter}
];
function sky(c1,c2,moonX=.75,moonY=.2,moonA=.72){let g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,c1);g.addColorStop(.58,c2);g.addColorStop(1,'#06090a');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);stars.forEach(s=>{ctx.fillStyle='rgba(231,225,207,'+s.a+')';ctx.beginPath();ctx.arc(s.x*W,s.y*H,s.r,0,7);ctx.fill()});let r=Math.min(W,H)*.062,x=W*moonX,y=H*moonY,mg=ctx.createRadialGradient(x,y,0,x,y,r*3.6);mg.addColorStop(0,'rgba(245,233,199,'+moonA+')');mg.addColorStop(.25,'rgba(225,214,182,.23)');mg.addColorStop(1,'rgba(225,214,182,0)');ctx.fillStyle=mg;ctx.beginPath();ctx.arc(x,y,r*3.6,0,7);ctx.fill();ctx.fillStyle='rgba(232,223,195,'+moonA+')';ctx.beginPath();ctx.arc(x,y,r,0,7);ctx.fill()}
function poly(points,fill,a=1){ctx.save();ctx.globalAlpha=a;ctx.fillStyle=fill;ctx.beginPath();ctx.moveTo(points[0][0],points[0][1]);for(let i=1;i<points.length;i++)ctx.lineTo(points[i][0],points[i][1]);ctx.closePath();ctx.fill();ctx.restore()}
function mountains(base=.52,a=.9){poly([[0,H*base],[W*.11,H*(base-.09)],[W*.21,H*(base-.04)],[W*.34,H*(base-.15)],[W*.49,H*(base-.05)],[W*.63,H*(base-.17)],[W*.78,H*(base-.06)],[W*.9,H*(base-.12)],[W,H*(base-.08)],[W,H*.68],[0,H*.68]],'#101719',a);poly([[0,H*(base+.04)],[W*.16,H*(base-.03)],[W*.29,H*(base+.01)],[W*.45,H*(base-.06)],[W*.62,H*(base+.01)],[W*.82,H*(base-.04)],[W,H*(base-.01)],[W,H*.7],[0,H*.7]],'#192123',a*.72)}
function water(t,top='#222b2c'){let g=ctx.createLinearGradient(0,H*.5,0,H);g.addColorStop(0,top);g.addColorStop(1,'#050809');ctx.fillStyle=g;ctx.fillRect(0,H*.5,W,H*.5);for(let y=H*.54;y<H;y+=7){ctx.strokeStyle='rgba(198,202,190,'+(0.013+y/H*.042)+')';ctx.lineWidth=.65;ctx.beginPath();for(let x=-20;x<W+20;x+=16)ctx.lineTo(x,y+Math.sin(x*.022+t*.48+y*.016)*1.7);ctx.stroke()}}
function mist(t,n=6){for(let i=0;i<n;i++){ctx.save();ctx.globalAlpha=.026+i*.004;ctx.filter='blur(15px)';ctx.fillStyle='#d8ded7';let yy=H*(.42+i*.068),shift=Math.sin(t*.035+i)*W*.06;ctx.beginPath();ctx.ellipse(W*.5+shift,yy,W*(.27+i*.04),H*.025,0,0,7);ctx.fill();ctx.restore()}}
function drawBoat(x,y,sc=1,lantern=false,person=true){ctx.save();ctx.translate(x,y);ctx.scale(sc,sc);ctx.fillStyle='#020404';ctx.beginPath();ctx.moveTo(-75,0);ctx.quadraticCurveTo(0,22,88,0);ctx.lineTo(53,14);ctx.lineTo(-49,14);ctx.closePath();ctx.fill();ctx.strokeStyle='rgba(199,178,134,.25)';ctx.beginPath();ctx.moveTo(14,0);ctx.lineTo(14,-72);ctx.stroke();ctx.fillStyle='#0b100f';ctx.fillRect(-10,-28,42,25);if(person)drawPerson(6,-24,.8,false);if(lantern){ctx.fillStyle='rgba(201,132,62,.88)';ctx.shadowBlur=22;ctx.shadowColor='#d88b45';ctx.beginPath();ctx.arc(41,-17,5,0,7);ctx.fill();ctx.shadowBlur=0}ctx.restore()}
function drawPerson(x,y,s=1,young=false){ctx.save();ctx.translate(x,y);ctx.scale(s,s);ctx.fillStyle=young?'rgba(34,24,19,.9)':'rgba(6,8,8,.96)';ctx.beginPath();ctx.arc(0,-14,4.5,0,7);ctx.fill();ctx.beginPath();ctx.moveTo(-8,-10);ctx.lineTo(7,-10);ctx.lineTo(11,20);ctx.lineTo(-13,20);ctx.closePath();ctx.fill();ctx.restore()}
function particleField(t,a=.035){particles.forEach(p=>{let x=p.x*W+Math.sin(t*.13+p.p)*15,y=(p.y*H+t*.45*p.s)%H;ctx.fillStyle='rgba(225,217,194,'+(p.r*a)+')';ctx.beginPath();ctx.arc(x,y,p.r,0,7);ctx.fill()})}
function foregroundReeds(t,close=false){ctx.save();if(close)ctx.filter='blur(2.2px)';reeds.forEach((r,i)=>{if(close&&i%2) return;let x=r.x*W,y=H*(.72+r.d*.17),h=r.h*H*(close?1.55:1),sw=Math.sin(t*.42+r.p)*10*r.d;ctx.strokeStyle='rgba(151,139,104,'+(r.a*(close?.68:1))+')';ctx.lineWidth=(close?1.1:.55)+r.d*.35;ctx.beginPath();ctx.moveTo(x,y);ctx.quadraticCurveTo(x+sw*.3,y-h*.55,x+sw,y-h);ctx.stroke();ctx.fillStyle='rgba(171,153,108,'+(r.a*.7)+')';ctx.beginPath();ctx.ellipse(x+sw,y-h,10*r.d*(close?1.5:1),2*r.d,-.23,0,7);ctx.fill()});ctx.restore()}
function roof(x,y,w,s=1){ctx.save();ctx.translate(x,y);ctx.scale(s,s);ctx.fillStyle='#0b0f0f';ctx.beginPath();ctx.moveTo(-w/2,0);ctx.quadraticCurveTo(0,-w*.12,w/2,0);ctx.lineTo(w*.33,w*.09);ctx.lineTo(-w*.33,w*.09);ctx.closePath();ctx.fill();for(let i=-4;i<=4;i++){ctx.strokeStyle='rgba(173,162,139,.12)';ctx.beginPath();ctx.moveTo(i*w/10,-2);ctx.lineTo(i*w/12,w*.07);ctx.stroke()}ctx.restore()}
function shotRiver(t,u){sky('#142124','#374040',.77,.2,.72);mountains(.52,.92);water(t);mist(t);let x=W*(.18+.24*u);drawBoat(x,H*.72,.78,true,true);foregroundReeds(t,false);particleField(t,.026)}
function shotReeds(t,u){sky('#101b1d','#313b3a',.7,.18,.65);mountains(.55,.68);water(t,'#243032');mist(t,5);drawBoat(W*(.58+.06*u),H*.68,.9,false,true);foregroundReeds(t,true);particleField(t,.028)}
function shotTower(t,u){sky('#10191c','#303637',.79,.16,.62);mountains(.56,.55);water(t,'#20282a');mist(t,5);let x=W*.39,y=H*.64;ctx.fillStyle='#0a0e0e';ctx.fillRect(x-50,y-180,100,180);for(let k=0;k<4;k++){roof(x,y-180+k*44,155-k*13,1)}ctx.fillStyle='rgba(182,112,52,.18)';for(let r=0;r<3;r++)for(let c=0;c<2;c++)ctx.fillRect(x-27+c*36,y-142+r*43,16,20);ctx.fillStyle='#111718';for(let i=0;i<8;i++)ctx.fillRect(x-95+i*26,y-4,19,4);ctx.strokeStyle='rgba(170,160,137,.15)';ctx.beginPath();ctx.moveTo(x-130,y);ctx.lineTo(x+155,y);ctx.stroke();ctx.save();ctx.filter='blur(3px)';ctx.strokeStyle='rgba(5,8,8,.75)';ctx.lineWidth=7;ctx.beginPath();ctx.moveTo(W*.04,H*.2);ctx.bezierCurveTo(W*.13,H*.29,W*.16,H*.42,W*.21,H*.57);ctx.stroke();ctx.restore();particleField(t,.024)}
function shotMooring(t,u){sky('#10191b','#2c3332',.8,.19,.55);water(t,'#20292a');mist(t,4);ctx.fillStyle='#171915';ctx.fillRect(0,H*.66,W,H*.34);for(let i=0;i<7;i++){ctx.strokeStyle='rgba(149,140,116,.17)';ctx.beginPath();ctx.moveTo(0,H*(.68+i*.045));ctx.lineTo(W,H*(.68+i*.045));ctx.stroke()}drawBoat(W*.68,H*.66,1.15,true,true);ctx.strokeStyle='#1b1812';ctx.lineWidth=7;ctx.beginPath();ctx.moveTo(W*.58,H*.65);ctx.quadraticCurveTo(W*.49,H*.7,W*.35,H*.79);ctx.stroke();ctx.fillStyle='#252018';ctx.fillRect(W*.31,H*.73,20,74);ctx.save();ctx.filter='blur(2px)';ctx.strokeStyle='#0c1210';ctx.lineWidth=12;ctx.beginPath();ctx.moveTo(W*.92,H*.06);ctx.bezierCurveTo(W*.82,H*.18,W*.85,H*.36,W*.77,H*.55);ctx.stroke();for(let i=0;i<25;i++){let x=W*(.83+i*.004);ctx.lineWidth=1.4;ctx.beginPath();ctx.moveTo(x,H*.17);ctx.quadraticCurveTo(x-40,H*.39,x-20+Math.sin(t+i)*7,H*.63);ctx.stroke()}ctx.restore()}
function shotMemory(t,u){let g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#563b29');g.addColorStop(.52,'#8d6a45');g.addColorStop(1,'#251b15');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);ctx.fillStyle='rgba(244,211,151,.12)';ctx.fillRect(0,0,W,H);ctx.save();ctx.filter='blur(7px)';for(let i=0;i<7;i++){ctx.fillStyle='rgba(248,207,121,'+(i*.018+.025)+')';ctx.beginPath();ctx.arc(W*(.16+i*.12),H*(.18+(i%2)*.08),25+i*3,0,7);ctx.fill()}ctx.restore();ctx.fillStyle='#3b2619';ctx.fillRect(0,H*.7,W,H*.3);ctx.fillStyle='rgba(227,197,140,.22)';ctx.beginPath();ctx.ellipse(W*.34,H*.66,80,21,0,0,7);ctx.fill();ctx.fillStyle='#6f5137';ctx.beginPath();ctx.ellipse(W*.34,H*.62,32,12,0,0,7);ctx.fill();ctx.fillRect(W*.32,H*.62,40,46);ctx.fillStyle='rgba(220,173,100,.4)';ctx.beginPath();ctx.ellipse(W*.34,H*.62,25,8,0,0,7);ctx.fill();drawPerson(W*.56,H*.63,1.3,true);drawPerson(W*.68,H*.64,1.25,true);ctx.strokeStyle='#3b2719';ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(W*.88,H*.03);ctx.bezierCurveTo(W*.82,H*.15,W*.77,H*.26,W*.73,H*.46);ctx.stroke();petals.forEach(p=>{let x=(p.x*W+t*8*p.s)%W,y=(p.y*H+t*12*p.s)%H;ctx.fillStyle='rgba(229,184,105,.38)';ctx.beginPath();ctx.ellipse(x,y,3*p.s,1.4*p.s,p.p,0,7);ctx.fill()});particleField(t,.055)}
function shotRuin(t,u){sky('#091114','#22292a',.82,.17,.48);mountains(.53,.83);water(t,'#182123');mist(t,7);let x=W*.22,y=H*.69;poly([[x-110,y],[x-78,y-75],[x-48,y-108],[x-7,y-82],[x+28,y-152],[x+55,y-92],[x+93,y-47],[x+132,y],[x-110,y]],'#070b0c',1);ctx.strokeStyle='rgba(182,178,164,.1)';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(x+23,y-147);ctx.lineTo(x+7,y-82);ctx.lineTo(x+42,y-35);ctx.stroke();ctx.fillStyle='#0a0f10';ctx.fillRect(W*.72,H*.46,34,H*.19);roof(W*.737,H*.45,90,.9);for(let i=0;i<115;i++){let xx=((i*79+t*32)%(W+100))-50,yy=((i*41+t*100)%H);ctx.strokeStyle='rgba(207,215,216,.1)';ctx.beginPath();ctx.moveTo(xx,yy);ctx.lineTo(xx-4,yy+15);ctx.stroke()}particleField(t,.018)}
function shotLandscape(t,u){sky('#0b1417','#242c2d',.73,.19,.55);mountains(.5,1);water(t,'#1c2527');mist(t,7);ctx.save();ctx.translate(W*.48,H*.63);ctx.scale(.85,.85);drawPerson(0,0,.8,false);ctx.restore();ctx.strokeStyle='rgba(120,115,101,.2)';ctx.beginPath();ctx.moveTo(W*.38,H*.68);ctx.bezierCurveTo(W*.46,H*.64,W*.52,H*.67,W*.66,H*.74);ctx.stroke();foregroundReeds(t,false);particleField(t,.022)}
function shotWine(t,u){sky('#151a1b','#35322d',.78,.17,.64);ctx.save();ctx.filter='blur(8px)';ctx.fillStyle='rgba(232,194,126,.08)';for(let i=0;i<6;i++){ctx.beginPath();ctx.arc(W*(.62+i*.06),H*(.21+(i%2)*.07),24+i*4,0,7);ctx.fill()}ctx.restore();ctx.fillStyle='#17120e';ctx.fillRect(0,H*.61,W,H*.39);ctx.fillStyle='#2c231b';ctx.beginPath();ctx.ellipse(W*.52,H*.64,78,24,0,0,7);ctx.fill();ctx.fillRect(W*.47,H*.64,110,95);ctx.fillStyle='#8b7359';ctx.beginPath();ctx.ellipse(W*.52,H*.61,42,15,0,0,7);ctx.fill();ctx.fillStyle='rgba(194,151,84,.52)';ctx.beginPath();ctx.ellipse(W*.52,H*.605,33,10,0,0,7);ctx.fill();petals.forEach(p=>{let yy=((p.y+t*.009*p.s)%1)*H,xx=p.x*W+Math.sin(t*.5+p.p)*24;ctx.fillStyle='rgba(221,181,104,.4)';ctx.beginPath();ctx.ellipse(xx,yy,3*p.s,1.5*p.s,p.p,0,7);ctx.fill()});ctx.save();ctx.filter='blur(2px)';ctx.strokeStyle='#16100d';ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(W*.82,0);ctx.bezierCurveTo(W*.76,H*.18,W*.72,H*.29,W*.68,H*.45);ctx.stroke();ctx.restore()}
function shotGhost(t,u){sky('#080e10','#1b2223',.77,.17,.46);water(t,'#151d1f');mist(t,8);drawBoat(W*.53,H*.7,1.05,false,true);ctx.save();ctx.globalCompositeOperation='screen';ctx.globalAlpha=.22*(1-u);ctx.translate(W*.62,H*.61);drawPerson(0,0,1.25,true);ctx.restore();ctx.save();ctx.filter='blur(10px)';ctx.globalAlpha=.08*(1-u);ctx.fillStyle='#d69b61';ctx.beginPath();ctx.arc(W*.62,H*.56,90,0,7);ctx.fill();ctx.restore();particleField(t,.015)}
function shotDeparture(t,u){sky('#070d0f','#171e20',.76,.16,.52);mountains(.53,.78);water(t,'#131b1d');mist(t,9);let sc=1-.48*u,x=W*(.46+.08*u),y=H*(.7-.015*u);drawBoat(x,y,sc,false,true);foregroundReeds(t,false);particleField(t,.016)}
function shotAfter(t,u){sky('#05090a','#111718',.74,.15,.38);mountains(.55,.55);water(t,'#0e1517');mist(t,10);drawBoat(W*.57,H*.69,.48*(1-.2*u),false,false);ctx.fillStyle='rgba(0,0,0,'+(u*.38)+')';ctx.fillRect(0,0,W,H);particleField(t,.01)}
function render(ms){let t=started?(ms-t0)/1000:0;let s=scenes[0];for(const q of scenes)if(t>=q.start)s=q;let u=clamp((t-s.start)/(s.end-s.start));ctx.clearRect(0,0,W,H);s.fn(t,u);requestAnimationFrame(render)}requestAnimationFrame(render);
function showCaption(i){caption.classList.remove('show');setTimeout(()=>{caption.className='caption '+caps[i][1];caption.innerHTML=caps[i][2];requestAnimationFrame(()=>caption.classList.add('show'))},420)}
function sceneIndex(t){let n=0;for(let i=0;i<scenes.length;i++)if(t>=scenes[i].start)n=i;return n}
function changeScene(i){ink.style.opacity=.82;setTimeout(()=>ink.style.opacity=0,560);chapter.style.opacity=0;setTimeout(()=>{chapter.textContent=scenes[i].title;chapter.style.opacity=.68},540);if(i===9)seal.style.opacity=1;if(i===2)chime()}
function playVoice(i){voices.forEach((v,j)=>{if(j!==i){v.pause();v.currentTime=0}});const v=voices[i];v.currentTime=0;v.volume=muted?0:.98;v.play().catch(()=>{})}
function anyVoice(){return voices.some(v=>!v.paused&&!v.ended)}
function ambient(){audioCtx=new(window.AudioContext||window.webkitAudioContext)();ambGain=audioCtx.createGain();ambGain.gain.value=.04;ambGain.connect(audioCtx.destination);let b=audioCtx.createBuffer(1,audioCtx.sampleRate*3,audioCtx.sampleRate),d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;let n=audioCtx.createBufferSource(),f=audioCtx.createBiquadFilter();n.buffer=b;n.loop=true;f.type='lowpass';f.frequency.value=460;n.connect(f).connect(ambGain);n.start()}
function chime(){if(!audioCtx||muted)return;let o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type='sine';o.frequency.value=392;g.gain.setValueAtTime(.0001,audioCtx.currentTime);g.gain.exponentialRampToValueAtTime(.045,audioCtx.currentTime+.04);g.gain.exponentialRampToValueAtTime(.0001,audioCtx.currentTime+4.2);o.connect(g).connect(audioCtx.destination);o.start();o.stop(audioCtx.currentTime+4.3)}
function mix(t){let duck=anyVoice()?.4:1,iv=.16*(1-smooth(30,40,t))*duck,mv=.14*smooth(33,38,t)*(1-smooth(57,68,t))*duck;if(t>=54&&!riseStarted){riseStarted=true;music.rise.currentTime=0;music.rise.play().catch(()=>{})}let rv=.11*smooth(54,64,t)*(1-smooth(82,90,t))*duck;if(t>82){iv*=.14;mv*=.14;rv*=.22}if(t>90){iv*=.04;mv*=.04;rv*=.05}if(t>101){iv=.028*duck;mv=0;rv=0}music.intro.volume=muted?0:clamp(iv);music.memory.volume=muted?0:clamp(mv);music.rise.volume=muted?0:clamp(rv);if(ambGain&&audioCtx)ambGain.gain.setTargetAtTime(muted?0:(t>90?.018:.04),audioCtx.currentTime,.2)}
const duration=115;
function tick(ms){if(!started)return;let t=(ms-t0)/1000;progress.style.width=Math.min(100,t/duration*100)+'%';let ci=0;for(let i=0;i<caps.length;i++)if(t>=caps[i][0])ci=i;if(ci!==lastCap){lastCap=ci;showCaption(ci)}let vi=-1;for(let i=0;i<voiceTimes.length;i++)if(t>=voiceTimes[i])vi=i;if(vi!==lastVoice){lastVoice=vi;playVoice(vi)}let si=sceneIndex(t);if(si!==lastScene){lastScene=si;changeScene(si)}mix(t);if(t<duration)requestAnimationFrame(tick)}
document.querySelector('#enter').onclick=()=>{started=true;t0=performance.now();intro.style.opacity=0;setTimeout(()=>intro.remove(),1850);ambient();music.intro.currentTime=0;music.memory.currentTime=0;music.intro.play().catch(()=>{});music.memory.play().catch(()=>{});requestAnimationFrame(tick)};
soundBtn.onclick=()=>{muted=!muted;soundBtn.textContent=muted?'声音关闭':'声音开启';voices.forEach(v=>v.muted=muted);Object.values(music).forEach(v=>v.muted=muted);if(ambGain&&audioCtx)ambGain.gain.setTargetAtTime(muted?0:.04,audioCtx.currentTime,.2)};
