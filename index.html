<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050708">
<title>少年游 · 电影 3D 版</title>
<link rel="preload" as="audio" href="assets/v5/audio/narration.mp3">
<link rel="preload" as="image" href="assets/v4/scenes/scene01.webp">
<style>
:root{--ivory:#eee5d4;--gold:#aa8c5c}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#030506;color:var(--ivory);font-family:"Songti SC","STSong","Noto Serif SC",serif}
body{touch-action:manipulation}
#stage{position:fixed;inset:0;overflow:hidden;background:#050708}
#webgl{position:absolute;inset:0;width:100%;height:100%;display:block}
#fallback{position:absolute;inset:0;background:url("assets/v4/scenes/scene01.webp") center/cover;filter:brightness(.72) saturate(.8);display:none}
.fx{position:absolute;inset:0;pointer-events:none}
#grade{z-index:7;background:linear-gradient(180deg,rgba(4,16,22,.10),rgba(4,8,10,.015) 42%,rgba(0,0,0,.17));mix-blend-mode:color}
#grain{z-index:8;opacity:.055;mix-blend-mode:soft-light;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.86' numOctaves='4' seed='23' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.9'/%3E%3C/svg%3E")}
#vignette{z-index:9;background:radial-gradient(ellipse at 50% 47%,transparent 28%,rgba(0,0,0,.13) 62%,rgba(0,0,0,.72) 120%)}
#letterbox{z-index:10;background:linear-gradient(#000 0 4.8vh,transparent 4.8vh calc(100% - 4.8vh),#000 calc(100% - 4.8vh))}
#fade{z-index:11;background:#030405;opacity:0;transition:opacity 2.5s ease}

#intro{position:fixed;z-index:40;inset:0;display:grid;place-items:center;background:#050708;transition:opacity 1.5s ease;overflow:hidden}
#intro::before{content:"";position:absolute;inset:-5%;background:url("assets/v4/scenes/scene01.webp") center/cover;filter:brightness(.28) saturate(.65);transform:scale(1.08)}
#intro::after{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at 50% 47%,rgba(0,0,0,.05),rgba(0,0,0,.77) 110%)}
.introbox{position:relative;z-index:2;text-align:center;padding:24px}
.era{font:10px/1.5 -apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif;letter-spacing:.5em;color:#aa916c;margin-bottom:25px}
h1{font-size:clamp(56px,9vw,110px);font-weight:400;letter-spacing:.21em;text-indent:.21em;margin:0;text-shadow:0 8px 42px #000}
.subhead{font-size:12px;letter-spacing:.42em;color:rgba(229,219,200,.7);margin-top:16px}
#enter{margin-top:52px;border:1px solid rgba(223,208,177,.34);border-radius:99px;background:rgba(255,255,255,.025);color:#e0d5c1;padding:13px 31px;letter-spacing:.31em;cursor:pointer;backdrop-filter:blur(10px)}
#enter:disabled{opacity:.3;cursor:default}
#loadState{height:15px;margin-top:17px;font:9px -apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif;letter-spacing:.15em;color:rgba(214,202,181,.44)}

#captionWrap{position:fixed;z-index:22;left:50%;bottom:10vh;transform:translateX(-50%);width:min(88vw,980px);text-align:center;pointer-events:none}
#caption{display:inline-block;opacity:0;transform:translateY(8px);filter:blur(2px);font-size:clamp(17px,2.05vw,28px);line-height:1.82;letter-spacing:.12em;color:#f0e7d7;text-shadow:0 3px 20px #000,0 1px 5px #000;transition:opacity .55s ease,transform .55s ease,filter .55s ease}
#caption.show{opacity:1;transform:none;filter:none}
#caption.poem{font-size:clamp(25px,3.55vw,46px);letter-spacing:.19em;line-height:1.7}
#chapter{position:fixed;z-index:21;left:5vw;top:8.7vh;opacity:0;color:rgba(232,222,202,.55);font:10px -apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif;letter-spacing:.27em;transition:opacity .55s ease}
#chapter.show{opacity:1}
#sound{position:fixed;z-index:24;right:4vw;top:7vh;border:0;background:transparent;color:rgba(230,221,203,.48);font:9px -apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif;letter-spacing:.18em;cursor:pointer}
#progress{position:fixed;z-index:24;left:0;bottom:0;height:1px;width:0;background:linear-gradient(90deg,#5c4d38,#d1b47a);box-shadow:0 0 12px rgba(204,178,117,.36)}
#seal{position:fixed;z-index:23;right:7vw;bottom:10vh;opacity:0;border:1px solid rgba(153,50,38,.78);color:#b34d40;padding:8px 6px 5px;font-size:12px;letter-spacing:.13em;writing-mode:vertical-rl;background:rgba(25,7,5,.18);transition:opacity 1.9s ease}
#replay{position:fixed;z-index:25;left:50%;bottom:7vh;transform:translateX(-50%);opacity:0;pointer-events:none;border:1px solid rgba(220,207,180,.25);border-radius:99px;background:rgba(5,7,7,.45);color:rgba(232,223,205,.78);padding:10px 22px;letter-spacing:.22em;font-size:11px;transition:opacity 1s}
#replay.show{opacity:1;pointer-events:auto}
@media(max-width:640px){
#letterbox{background:linear-gradient(#000 0 3vh,transparent 3vh calc(100% - 3vh),#000 calc(100% - 3vh))}
#captionWrap{bottom:9vh;width:91vw}#caption{font-size:17px;line-height:1.9;letter-spacing:.1em}#caption.poem{font-size:clamp(25px,7.3vw,37px)}
#chapter{left:5vw;top:6.3vh}#sound{right:4vw;top:4.7vh}#seal{right:6vw;bottom:9vh}
}
</style>
</head>
<body>
<div id="stage">
  <canvas id="webgl"></canvas><div id="fallback"></div>
  <div id="grade" class="fx"></div><div id="grain" class="fx"></div><div id="vignette" class="fx"></div><div id="letterbox" class="fx"></div><div id="fade" class="fx"></div>
</div>
<div id="intro"><div class="introbox"><div class="era">南宋 · 刘过</div><h1>少年游</h1><div class="subhead">唐多令 · 芦叶满汀洲</div><button id="enter" disabled>入 江</button><div id="loadState">3D 场景载入中</div></div></div>
<div id="chapter"></div>
<button id="sound">声音开启</button>
<div id="captionWrap"><div id="caption"></div></div>
<div id="seal">少年游</div>
<button id="replay">再看一遍</button>
<div id="progress"></div>
<audio id="voice" preload="auto" src="assets/v5/audio/narration.mp3"></audio>
<audio id="score" preload="auto" src="assets/v4/audio/score.mp3"></audio>

<script type="module">
import * as THREE from './assets/v5/vendor/three.module.js';

const canvas=document.querySelector('#webgl'),fallback=document.querySelector('#fallback'),intro=document.querySelector('#intro'),
enter=document.querySelector('#enter'),loadState=document.querySelector('#loadState'),voice=document.querySelector('#voice'),
score=document.querySelector('#score'),caption=document.querySelector('#caption'),chapter=document.querySelector('#chapter'),
sound=document.querySelector('#sound'),progress=document.querySelector('#progress'),seal=document.querySelector('#seal'),
fade=document.querySelector('#fade'),replay=document.querySelector('#replay');

const images=Array.from({length:9},(_,i)=>'assets/v4/scenes/scene'+String(i+1).padStart(2,'0')+'.webp');
const depths=Array.from({length:9},(_,i)=>'assets/v5/depth/depth'+String(i+1).padStart(2,'0')+'.webp');

const cues=[
 {t:0,s:0,title:'江上初见',depth:1.05,cam:[[-.22,.06,7.65],[.18,.13,7.15]],fx:'mist'},
 {t:14.65,s:1,title:'芦洲寒水',depth:.95,cam:[[.19,.02,7.35],[-.16,.12,7.7]],fx:'reeds'},
 {t:20.34,s:2,title:'重过南楼',depth:.75,cam:[[-.18,.12,7.55],[.16,.05,7.05]],fx:'rain'},
 {t:23.54,s:3,title:'柳下系舟',depth:.62,cam:[[.18,.03,7.35],[-.13,.10,7.72]],fx:'willow'},
 {t:30.43,s:4,title:'旧梦回潮',depth:.58,cam:[[-.12,.06,7.5],[.11,.0,7.08]],fx:'petals'},
 {t:47.09,s:5,title:'黄鹤断矶',depth:.56,cam:[[-.16,.14,7.48],[.13,.02,7.22]],fx:'rain'},
 {t:53.41,s:6,title:'旧江山',depth:.52,cam:[[.18,.04,7.32],[-.13,.1,7.66]],fx:'mist'},
 {t:57.10,s:7,title:'桂花载酒',depth:.48,cam:[[-.09,.01,7.42],[.08,.06,7.12]],fx:'petals'},
 {t:61.10,s:8,title:'终不似',depth:.5,cam:[[.13,.09,7.45],[-.08,.02,7.82]],fx:'mist'}
];
const captions=[
 {a:0,b:3.10,text:'二十年……可以改变多少事。'},
 {a:3.94,b:13.57,text:'一个人，从少年，走到暮色。<br>一座城，换了人间。可江水……仍旧这样流。'},
 {a:14.65,b:19.27,text:'芦叶满汀洲，寒沙带浅流。',poem:1},
 {a:20.34,b:22.92,text:'二十年重过南楼。',poem:1},
 {a:23.54,b:29.38,text:'柳下系船犹未稳，<br>能几日，又中秋。',poem:1},
 {a:30.43,b:36.30,text:'我们总以为，回到旧地，<br>就能把从前……也一并找回来。'},
 {a:37.30,b:45.67,text:'后来才知道——故地，可以重游。<br>故人……却未必还在。'},
 {a:47.09,b:49.35,text:'黄鹤断矶头。',poem:1},
 {a:50.11,b:52.27,text:'故人……今在否？',poem:1},
 {a:53.41,b:56.42,text:'旧江山，浑是新愁。',poem:1},
 {a:57.10,b:60.22,text:'欲买桂花同载酒。',poem:1},
 {a:61.10,b:62.27,text:'终不似……',poem:1},
 {a:63.05,b:64.42,text:'少年游。',poem:1},
 {a:65.75,b:70.65,text:'场景还在。<br>人生……却早已走远了。'}
];

let renderer,scene,camera,group,meshA,meshB,front,back,currentScene=-1,transition=null,started=false,ended=false,muted=false,currentCaption=-1;
let textures=[],depthTextures=[],water,rain,petals,reeds,willow,mists=[],clock=new THREE.Clock(),envCtx=null,envGain=null;
const texLoader=new THREE.TextureLoader();
const clamp=(v,a=0,b=1)=>Math.max(a,Math.min(b,v)),ease=t=>t*t*(3-2*t),lerp=(a,b,t)=>a+(b-a)*t;

function loadTex(url,color=false){return new Promise((res,rej)=>texLoader.load(url,t=>{if(color)t.colorSpace=THREE.SRGBColorSpace;t.anisotropy=4;res(t)},undefined,rej))}
async function preload(){
 try{
  [textures,depthTextures]=await Promise.all([
   Promise.all(images.map(x=>loadTex(x,true))),Promise.all(depths.map(x=>loadTex(x,false)))
  ]);
  loadState.textContent='3D 场景已就绪';enter.disabled=false;
 }catch(e){console.error(e);loadState.textContent='3D 资源加载失败';fallback.style.display='block'}
}

function init3D(){
 try{
  renderer=new THREE.WebGLRenderer({canvas,antialias:innerWidth>700,alpha:false,powerPreference:'high-performance'});
  renderer.setPixelRatio(Math.min(devicePixelRatio||1,innerWidth<700?1.35:1.7));renderer.setSize(innerWidth,innerHeight,false);
  renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=.97;
  scene=new THREE.Scene();scene.background=new THREE.Color(0x050708);scene.fog=new THREE.FogExp2(0x819094,.025);
  camera=new THREE.PerspectiveCamera(36,innerWidth/innerHeight,.1,40);camera.position.set(0,.05,7.65);
  group=new THREE.Group();scene.add(group);
  const hemi=new THREE.HemisphereLight(0xe8eef0,0x28323a,2.15);scene.add(hemi);
  const key=new THREE.DirectionalLight(0xffedd2,1.05);key.position.set(-3,4,6);scene.add(key);
  const geo=new THREE.PlaneGeometry(16,9,160,90);
  const makeMat=()=>new THREE.MeshStandardMaterial({transparent:true,opacity:0,side:THREE.DoubleSide,depthWrite:true,roughness:1,metalness:0,color:0xffffff});
  meshA=new THREE.Mesh(geo,makeMat());meshB=new THREE.Mesh(geo.clone(),makeMat());group.add(meshA,meshB);front=meshA;back=meshB;
  createWater();createMist();createRain();createPetals();createReeds();createWillow();resize();
 }catch(e){console.error(e);fallback.style.display='block';canvas.style.display='none'}
}

function coverScale(){
 if(!camera)return 1;const d=camera.position.z;const vh=2*Math.tan(THREE.MathUtils.degToRad(camera.fov*.5))*d,vw=vh*camera.aspect;
 return Math.max(vw/16,vh/9)*1.08;
}
function resize(){if(!renderer||!camera)return;camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight,false);const s=coverScale();meshA.scale.setScalar(s);meshB.scale.setScalar(s)}
addEventListener('resize',resize);

function assign(mesh,i){
 const c=cues.find(x=>x.s===i);mesh.material.map=textures[i];mesh.material.displacementMap=depthTextures[i];
 mesh.material.displacementScale=c.depth;mesh.material.displacementBias=-c.depth*.36;mesh.material.needsUpdate=true;
}
function setScene(i,now){
 if(i===currentScene)return;const prev=front;back=(front===meshA?meshB:meshA);assign(back,i);back.material.opacity=0;back.visible=true;
 transition={from:prev,to:back,start:now,dur:1.65};front=back;currentScene=i;
 chapter.classList.remove('show');setTimeout(()=>{chapter.textContent=cues.find(x=>x.s===i).title;chapter.classList.add('show');setTimeout(()=>chapter.classList.remove('show'),1450)},120);
 updateFX(cues.find(x=>x.s===i).fx);
}
function currentCue(t){let c=cues[0];for(const x of cues)if(t>=x.t)c=x;return c}
function nextCueTime(s){const idx=cues.findIndex(x=>x.s===s);return idx>=0&&idx<cues.length-1?cues[idx+1].t:71.04}

function makeRadialTexture(){
 const c=document.createElement('canvas');c.width=256;c.height=128;const x=c.getContext('2d'),g=x.createRadialGradient(128,64,4,128,64,118);
 g.addColorStop(0,'rgba(220,229,227,.34)');g.addColorStop(.45,'rgba(190,204,203,.15)');g.addColorStop(1,'rgba(160,180,180,0)');
 x.fillStyle=g;x.fillRect(0,0,256,128);const t=new THREE.CanvasTexture(c);return t;
}
function createMist(){const t=makeRadialTexture();for(let i=0;i<7;i++){const m=new THREE.Sprite(new THREE.SpriteMaterial({map:t,transparent:true,depthWrite:false,opacity:.09,blending:THREE.AdditiveBlending}));m.scale.set(6+i*.8,1.15+i*.08,1);m.position.set(-4+i*1.3,-.5+i*.17,1.2+i*.2);scene.add(m);mists.push(m)}}
function createWater(){
 const geo=new THREE.PlaneGeometry(22,18,70,55);
 const mat=new THREE.ShaderMaterial({transparent:true,depthWrite:false,uniforms:{uTime:{value:0},uOpacity:{value:.085}},
 vertexShader:`uniform float uTime; varying vec2 vUv; varying float w; void main(){vUv=uv;vec3 p=position;w=sin(p.x*2.3+uTime*.9)*.035+sin(p.y*3.5-uTime*.55)*.025;p.z+=w;gl_Position=projectionMatrix*modelViewMatrix*vec4(p,1.);}`,
 fragmentShader:`uniform float uOpacity; varying vec2 vUv; varying float w; void main(){float glint=.45+.55*sin((vUv.y*48.0)+(vUv.x*5.0)+w*25.0);vec3 c=mix(vec3(.28,.35,.37),vec3(.52,.59,.60),glint*.28);gl_FragColor=vec4(c,uOpacity*(.45+.55*glint));}`});
 water=new THREE.Mesh(geo,mat);water.rotation.x=-Math.PI/2.12;water.position.set(0,-3.15,2.35);water.renderOrder=4;scene.add(water);
}
function createRain(){
 const n=650,p=new Float32Array(n*3);for(let i=0;i<n;i++){p[i*3]=(Math.random()-.5)*16;p[i*3+1]=(Math.random()-.5)*10;p[i*3+2]=2+Math.random()*4}
 const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.BufferAttribute(p,3));rain=new THREE.Points(g,new THREE.PointsMaterial({color:0xd9e1e2,size:.025,transparent:true,opacity:.28,depthWrite:false}));rain.visible=false;scene.add(rain);
}
function createPetals(){
 const n=180,p=new Float32Array(n*3);for(let i=0;i<n;i++){p[i*3]=(Math.random()-.5)*14;p[i*3+1]=(Math.random()-.5)*8;p[i*3+2]=1+Math.random()*4}
 const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.BufferAttribute(p,3));petals=new THREE.Points(g,new THREE.PointsMaterial({color:0xe1b469,size:.045,transparent:true,opacity:.42,depthWrite:false}));petals.visible=false;scene.add(petals);
}
function createReeds(){
 reeds=new THREE.Group();const m=new THREE.LineBasicMaterial({color:0x26302a,transparent:true,opacity:.62});
 for(let i=0;i<38;i++){const x=(Math.random()-.5)*15,y=-4+Math.random()*1.2,z=2.4+Math.random()*2.7,h=1.4+Math.random()*2.5;
  const pts=[new THREE.Vector3(x,y,z),new THREE.Vector3(x+.05,y+h*.45,z),new THREE.Vector3(x+.12,y+h,z)];
  const l=new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts),m);l.userData.phase=Math.random()*6.28;reeds.add(l)}
 reeds.visible=false;scene.add(reeds);
}
function createWillow(){
 willow=new THREE.Group();const m=new THREE.LineBasicMaterial({color:0x17231c,transparent:true,opacity:.64});
 for(let i=0;i<24;i++){const x=-7.4+i*.62,y=4.5+Math.random()*.7,z=2.2+Math.random()*2.4,len=3.0+Math.random()*2.8;
  const curve=new THREE.CatmullRomCurve3([new THREE.Vector3(x,y,z),new THREE.Vector3(x-.25,y-len*.38,z+.05),new THREE.Vector3(x+.1,y-len,z)]);
  const l=new THREE.Line(new THREE.BufferGeometry().setFromPoints(curve.getPoints(10)),m);l.userData.phase=Math.random()*6.28;willow.add(l)}
 willow.visible=false;scene.add(willow);
}
function updateFX(type){rain.visible=type==='rain';petals.visible=type==='petals';reeds.visible=type==='reeds';willow.visible=type==='willow';water.material.uniforms.uOpacity.value=type==='rain'?.12:.075;scene.fog.density=type==='mist'?.032:type==='rain'?.028:.021}

function animateFX(t,dt){
 water.material.uniforms.uTime.value=t;
 mists.forEach((m,i)=>{m.position.x+=dt*(.025+i*.003);if(m.position.x>6.5)m.position.x=-6.5;m.material.opacity=.055+.025*Math.sin(t*.15+i)});
 if(rain.visible){const a=rain.geometry.attributes.position.array;for(let i=0;i<a.length;i+=3){a[i]-=dt*.75;a[i+1]-=dt*4.2;if(a[i+1]<-5){a[i+1]=5;a[i]=(Math.random()-.5)*16}}rain.geometry.attributes.position.needsUpdate=true}
 if(petals.visible){const a=petals.geometry.attributes.position.array;for(let i=0;i<a.length;i+=3){a[i]+=dt*.18*(.7+(i%5)*.1);a[i+1]-=dt*.22;if(a[i+1]<-4){a[i+1]=4;a[i]=(Math.random()-.5)*14}}petals.geometry.attributes.position.needsUpdate=true}
 if(reeds.visible)reeds.children.forEach((r,i)=>r.rotation.z=Math.sin(t*.6+r.userData.phase)*.012*(1+i%3));
 if(willow.visible)willow.children.forEach((r,i)=>r.rotation.z=Math.sin(t*.42+r.userData.phase)*.009*(1+i%4));
}
function updateCamera(t){
 const c=currentCue(t),end=nextCueTime(c.s),p=ease(clamp((t-c.t)/Math.max(2,end-c.t))),a=c.cam[0],b=c.cam[1];
 camera.position.set(lerp(a[0],b[0],p),lerp(a[1],b[1],p),lerp(a[2],b[2],p));
 camera.lookAt(lerp(-.08,.06,p),lerp(.02,-.03,p),0);
 const s=coverScale();meshA.scale.setScalar(s);meshB.scale.setScalar(s);
 group.rotation.y=lerp(-.012,.012,p);group.rotation.x=lerp(.005,-.005,p);
}
function setCaption(t){
 let idx=-1;for(let i=0;i<captions.length;i++)if(t>=captions[i].a&&t<captions[i].b)idx=i;
 if(idx===currentCaption)return;currentCaption=idx;caption.classList.remove('show');
 if(idx<0){setTimeout(()=>caption.innerHTML='',260);return}
 setTimeout(()=>{caption.innerHTML=captions[idx].text;caption.className=captions[idx].poem?'poem':'';requestAnimationFrame(()=>caption.classList.add('show'))},150);
}
function createEnv(){
 const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;envCtx=new AC();envGain=envCtx.createGain();envGain.gain.value=.011;envGain.connect(envCtx.destination);
 const b=envCtx.createBuffer(1,envCtx.sampleRate*2,envCtx.sampleRate),d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*(.5+.5*Math.sin(i*.00011));
 const s=envCtx.createBufferSource(),f=envCtx.createBiquadFilter();s.buffer=b;s.loop=true;f.type='lowpass';f.frequency.value=520;s.connect(f).connect(envGain);s.start();
}
function soundMix(t){score.volume=muted?0:(t<30?.19:t<47?.23:t<61?.14:.055);voice.volume=muted?0:1;if(envGain)envGain.gain.setTargetAtTime(muted?0:.011,envCtx.currentTime,.18)}
function render(){
 const dt=Math.min(clock.getDelta(),.05),now=clock.elapsedTime;
 if(renderer){
  if(started&&!ended){
   const t=voice.currentTime,ci=currentCue(t);if(ci.s!==currentScene)setScene(ci.s,now);
   if(transition){const p=clamp((now-transition.start)/transition.dur);transition.to.material.opacity=ease(p);transition.from.material.opacity=1-ease(p);if(p>=1){transition.from.visible=false;transition=null}}
   updateCamera(t);setCaption(t);soundMix(t);progress.style.width=Math.min(100,t/71.04*100)+'%';if(t>=62.8)seal.style.opacity=1;
  }
  animateFX(now,dt);renderer.render(scene,camera);
 }
 requestAnimationFrame(render)
}

async function startFilm(){
 if(started)return;started=true;ended=false;currentScene=-1;currentCaption=-1;seal.style.opacity=0;fade.style.opacity=0;replay.classList.remove('show');
 if(!renderer)init3D();createEnv();intro.style.opacity=0;setTimeout(()=>intro.style.display='none',1500);
 voice.currentTime=0;score.currentTime=0;score.play().catch(()=>{});voice.play().catch(()=>{});
}
enter.onclick=startFilm;
sound.onclick=()=>{muted=!muted;sound.textContent=muted?'声音关闭':'声音开启';voice.muted=muted;score.muted=muted;if(envGain)envGain.gain.setTargetAtTime(muted?0:.011,envCtx.currentTime,.18)};
voice.onended=()=>{ended=true;caption.classList.remove('show');progress.style.width='100%';score.volume=.035;setTimeout(()=>{fade.style.opacity=.42;replay.classList.add('show')},2500)};
replay.onclick=()=>{ended=false;started=true;currentScene=-1;currentCaption=-1;fade.style.opacity=0;seal.style.opacity=0;replay.classList.remove('show');meshA.visible=true;meshB.visible=true;voice.currentTime=0;score.currentTime=0;score.play().catch(()=>{});voice.play().catch(()=>{})};

await preload();init3D();assign(meshA,0);meshA.material.opacity=1;meshA.visible=true;meshB.visible=false;currentScene=0;updateFX('mist');render();
</script>
