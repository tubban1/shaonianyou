<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050708">
<title>少年游 · 二十年一江故梦</title>
<link rel="preload" as="image" href="assets/v4/scenes/scene01.webp">
<link rel="preload" as="audio" href="assets/v4/audio/narration.mp3">
<style>
:root{--ivory:#e8e0cf;--muted:#aaa394;--gold:#a98a58;--red:#8d3026}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050708;color:var(--ivory);font-family:"Songti SC","STSong","Noto Serif SC",serif}
body{touch-action:manipulation}
#film{position:fixed;inset:0;background:#050708;overflow:hidden}
.plate{position:absolute;inset:-4%;opacity:0;background-size:cover;background-position:center;will-change:transform,opacity;transition:opacity 1.75s cubic-bezier(.22,.61,.36,1)}
.plate.active{opacity:1}
#grade,#grain,#vignette,#letterbox,#fade,#fx{position:absolute;inset:0;pointer-events:none}
#grade{z-index:4;mix-blend-mode:color;background:linear-gradient(180deg,rgba(4,14,18,.09),rgba(3,7,8,.04) 45%,rgba(0,0,0,.12))}
#grain{z-index:5;opacity:.065;mix-blend-mode:soft-light;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.82' numOctaves='4' seed='13' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.9'/%3E%3C/svg%3E")}
#vignette{z-index:6;background:radial-gradient(ellipse at 50% 46%,transparent 27%,rgba(0,0,0,.16) 64%,rgba(0,0,0,.66) 118%)}
#letterbox{z-index:7;background:linear-gradient(#000 0 4.8vh,transparent 4.8vh calc(100% - 4.8vh),#000 calc(100% - 4.8vh))}
#fade{z-index:9;background:#030405;opacity:0;transition:opacity 2.4s ease}
#fx{z-index:3;width:100%;height:100%}

#intro{position:fixed;inset:0;z-index:40;display:grid;place-items:center;overflow:hidden;background:#050708;transition:opacity 1.35s ease}
#introBg{position:absolute;inset:-5%;background:url("assets/v4/scenes/scene01.webp") center/cover;filter:brightness(.38) saturate(.68);transform:scale(1.08)}
#intro::after{content:"";position:absolute;inset:0;background:radial-gradient(circle at 50% 48%,rgba(0,0,0,.08),rgba(0,0,0,.72) 110%)}
.introbox{position:relative;z-index:2;text-align:center;padding:28px 22px}
.era{font:10px/1.5 -apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif;letter-spacing:.48em;color:#a9916c;margin-bottom:24px}
h1{margin:0;font-size:clamp(56px,9vw,110px);font-weight:400;letter-spacing:.2em;text-indent:.2em;text-shadow:0 8px 42px rgba(0,0,0,.78)}
.subtitle{margin-top:16px;font-size:12px;letter-spacing:.42em;color:rgba(226,218,201,.7)}
.enter{margin-top:52px;border:1px solid rgba(219,204,173,.34);border-radius:99px;background:rgba(255,255,255,.025);color:#ded4c1;padding:13px 31px;letter-spacing:.32em;cursor:pointer;backdrop-filter:blur(10px)}
.enter:disabled{opacity:.35;cursor:default}
#loadState{height:15px;margin-top:17px;font:9px -apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif;letter-spacing:.14em;color:rgba(211,201,181,.43)}

#subtitleBox{position:fixed;z-index:20;left:50%;bottom:10.2vh;transform:translateX(-50%);width:min(86vw,920px);text-align:center;pointer-events:none}
#subtitleText{display:inline-block;opacity:0;transform:translateY(9px);filter:blur(3px);font-size:clamp(17px,2.15vw,28px);line-height:1.78;letter-spacing:.13em;color:#eee6d7;text-shadow:0 3px 18px rgba(0,0,0,.96),0 1px 4px #000;transition:opacity .7s ease,transform .7s ease,filter .7s ease}
#subtitleText.show{opacity:1;transform:none;filter:none}
#subtitleText.poem{font-size:clamp(25px,3.6vw,46px);letter-spacing:.2em;line-height:1.7}
#chapter{position:fixed;z-index:19;left:5.2vw;top:9vh;opacity:0;color:rgba(233,222,200,.58);font:10px/1.4 -apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif;letter-spacing:.28em;transition:opacity .7s ease}
#chapter.show{opacity:1}
#meta{position:fixed;z-index:19;right:4.6vw;top:7.7vh;color:rgba(225,215,195,.44);font:9px -apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif;letter-spacing:.18em}
#sound{border:0;background:transparent;color:inherit;font:inherit;letter-spacing:inherit;cursor:pointer}
#progress{position:fixed;z-index:22;left:0;bottom:0;height:1px;width:0;background:linear-gradient(90deg,#5f513c,#d0b47c);box-shadow:0 0 12px rgba(203,177,118,.35)}
#seal{position:fixed;z-index:21;right:7vw;bottom:10vh;opacity:0;border:1px solid rgba(154,51,39,.75);color:#b14d40;padding:8px 6px 5px;font-size:12px;letter-spacing:.12em;writing-mode:vertical-rl;background:rgba(22,7,6,.22);transition:opacity 2s ease}
#replay{position:fixed;z-index:25;left:50%;bottom:7vh;transform:translateX(-50%);opacity:0;pointer-events:none;border:1px solid rgba(220,207,180,.25);border-radius:99px;background:rgba(7,8,8,.38);color:rgba(230,221,204,.75);padding:10px 22px;letter-spacing:.23em;font-size:11px;transition:opacity 1s ease}
#replay.show{opacity:1;pointer-events:auto}

@media(max-width:640px){
#letterbox{background:linear-gradient(#000 0 3vh,transparent 3vh calc(100% - 3vh),#000 calc(100% - 3vh))}
#subtitleBox{bottom:9vh;width:91vw}
#subtitleText{font-size:17px;line-height:1.9;letter-spacing:.1em}
#subtitleText.poem{font-size:clamp(25px,7.4vw,37px)}
#chapter{left:5vw;top:6.5vh}
#meta{right:4vw;top:4.8vh}
#seal{right:6vw;bottom:9vh}
}
</style>
</head>
<body>
<div id="film">
  <div id="plateA" class="plate active"></div>
  <div id="plateB" class="plate"></div>
  <canvas id="fx"></canvas>
  <div id="grade"></div><div id="grain"></div><div id="vignette"></div><div id="letterbox"></div><div id="fade"></div>
</div>

<div id="intro">
  <div id="introBg"></div>
  <div class="introbox">
    <div class="era">南宋 · 刘过</div>
    <h1>少年游</h1>
    <div class="subtitle">唐多令 · 芦叶满汀洲</div>
    <button class="enter" id="enter" disabled>入 江</button>
    <div id="loadState">电影素材载入中</div>
  </div>
</div>

<div id="chapter"></div>
<div id="meta"><button id="sound">声音开启</button></div>
<div id="subtitleBox"><div id="subtitleText"></div></div>
<div id="seal">少年游</div>
<button id="replay">再看一遍</button>
<div id="progress"></div>

<audio id="voice" preload="auto" src="assets/v4/audio/narration.mp3"></audio>
<audio id="score" preload="auto" src="assets/v4/audio/score.mp3"></audio>

<script>
const sceneFiles=Array.from({length:9},(_,i)=>'assets/v4/scenes/scene'+String(i+1).padStart(2,'0')+'.webp');
const sceneCfg=[
 {img:0,title:'江上初见',pos:'50% 51%',from:'scale(1.105) translate3d(-1.2%,1.0%,0)',to:'scale(1.035) translate3d(1.0%,-.5%,0)',dur:13000,fx:'mist'},
 {img:1,title:'芦洲寒水',pos:'50% 52%',from:'scale(1.13) translate3d(-1.8%,1.5%,0)',to:'scale(1.055) translate3d(1.2%,-.3%,0)',dur:3900,fx:'reeds'},
 {img:2,title:'重过南楼',pos:'48% 51%',from:'scale(1.06) translate3d(-1%,.6%,0)',to:'scale(1.13) translate3d(1.1%,-.7%,0)',dur:3700,fx:'rain'},
 {img:3,title:'柳下系舟',pos:'56% 51%',from:'scale(1.11) translate3d(1.4%,.5%,0)',to:'scale(1.045) translate3d(-.6%,-.4%,0)',dur:5800,fx:'willow'},
 {img:4,title:'旧梦回潮',pos:'50% 52%',from:'scale(1.06) translate3d(-.8%,.7%,0)',to:'scale(1.115) translate3d(.7%,-.5%,0)',dur:10800,fx:'petals'},
 {img:5,title:'黄鹤断矶',pos:'51% 52%',from:'scale(1.09) translate3d(-1.1%,.8%,0)',to:'scale(1.035) translate3d(.7%,-.3%,0)',dur:8700,fx:'rain'},
 {img:6,title:'旧江山',pos:'52% 50%',from:'scale(1.12) translate3d(1.3%,.8%,0)',to:'scale(1.045) translate3d(-.9%,-.5%,0)',dur:2900,fx:'mist'},
 {img:7,title:'桂花载酒',pos:'52% 52%',from:'scale(1.08) translate3d(-.5%,.4%,0)',to:'scale(1.135) translate3d(.6%,-.4%,0)',dur:3300,fx:'petals'},
 {img:8,title:'终不似',pos:'50% 52%',from:'scale(1.11) translate3d(1.1%,.6%,0)',to:'scale(1.025) translate3d(-.4%,-.4%,0)',dur:9500,fx:'mist'}
];
const sceneCues=[
 {t:0,s:0},{t:13.121,s:1},{t:16.852,s:2},{t:20.563,s:3},{t:26.322,s:4},
 {t:37.087,s:5},{t:45.834,s:6},{t:48.711,s:7},{t:52.031,s:8}
];
const captions=[
 {t:0,e:1.55,text:'二十年。',poem:false},
 {t:1.70,e:3.45,text:'可以改变多少事。',poem:false},
 {t:3.75,e:6.45,text:'一个人，从少年，走到暮色。',poem:false},
 {t:6.71,e:9.75,text:'一座城，换了人间。',poem:false},
 {t:10.23,e:12.55,text:'可江水，仍旧这样流。',poem:false},
 {t:13.12,e:16.20,text:'芦叶满汀洲，寒沙带浅流。',poem:true},
 {t:16.85,e:20.05,text:'二十年重过南楼。',poem:true},
 {t:20.56,e:25.72,text:'柳下系船犹未稳，能几日，又中秋。',poem:true},
 {t:26.32,e:29.95,text:'我们总以为，回到旧地，就能把从前，也一并找回来。',poem:false},
 {t:30.42,e:34.55,text:'后来才知道。故地，可以重游。故人，却未必还在。',poem:false},
 {t:37.08,e:40.80,text:'黄鹤断矶头。',poem:true},
 {t:41.40,e:44.90,text:'故人……今在否？',poem:true},
 {t:45.83,e:48.40,text:'旧江山，浑是新愁。',poem:true},
 {t:48.71,e:51.70,text:'欲买桂花同载酒。',poem:true},
 {t:52.03,e:54.25,text:'终不似。',poem:true},
 {t:54.53,e:58.60,text:'少年游。',poem:true},
 {t:59.11,e:61.54,text:'场景还在。人生，却早已走远了。',poem:false}
];

const A=document.querySelector('#plateA'),B=document.querySelector('#plateB'),fx=document.querySelector('#fx'),
intro=document.querySelector('#intro'),enter=document.querySelector('#enter'),loadState=document.querySelector('#loadState'),
voice=document.querySelector('#voice'),score=document.querySelector('#score'),sub=document.querySelector('#subtitleText'),
chapter=document.querySelector('#chapter'),progress=document.querySelector('#progress'),sound=document.querySelector('#sound'),
seal=document.querySelector('#seal'),fade=document.querySelector('#fade'),replay=document.querySelector('#replay');
const ctx=fx.getContext('2d');
let W=0,H=0,D=1,front=A,back=B,currentScene=-1,currentCaption=-1,started=false,muted=false,ended=false,env=null;
let particles=[];
function resize(){W=innerWidth;H=innerHeight;D=Math.min(devicePixelRatio||1,2);fx.width=W*D;fx.height=H*D;fx.style.width=W+'px';fx.style.height=H+'px';ctx.setTransform(D,0,0,D,0,0)}
addEventListener('resize',resize);resize();

function makeParticles(type){
 const n=type==='rain'?125:type==='petals'?38:type==='reeds'?70:28;
 return Array.from({length:n},()=>({x:Math.random(),y:Math.random(),z:.4+Math.random()*1.2,p:Math.random()*6.28,s:.45+Math.random()*1.1}));
}
function switchScene(i){
 if(i===currentScene)return;
 currentScene=i;const c=sceneCfg[i];
 back.style.backgroundImage='url("'+sceneFiles[c.img]+'")';back.style.backgroundPosition=c.pos;
 back.classList.add('active');front.classList.remove('active');
 back.getAnimations().forEach(a=>a.cancel());
 back.animate([{transform:c.from},{transform:c.to}],{duration:c.dur,fill:'forwards',easing:'linear'});
 [front,back]=[back,front];
 particles=makeParticles(c.fx);
 chapter.textContent=c.title;chapter.classList.add('show');setTimeout(()=>chapter.classList.remove('show'),1700);
}
function captionAt(t){
 let idx=-1;for(let i=0;i<captions.length;i++)if(t>=captions[i].t&&t<captions[i].e)idx=i;
 if(idx===currentCaption)return;
 currentCaption=idx;sub.classList.remove('show');
 if(idx<0){setTimeout(()=>sub.textContent='',420);return}
 setTimeout(()=>{sub.textContent=captions[idx].text;sub.className=captions[idx].poem?'poem':'';requestAnimationFrame(()=>sub.classList.add('show'))},210);
}
function sceneAt(t){let s=0;for(const c of sceneCues)if(t>=c.t)s=c.s;return s}
function drawFX(ms){
 ctx.clearRect(0,0,W,H);
 if(currentScene<0)return;
 const type=sceneCfg[currentScene].fx;
 if(type==='mist'){
  ctx.save();ctx.globalCompositeOperation='screen';ctx.filter='blur(18px)';
  for(let i=0;i<6;i++){let x=W*(.5+Math.sin(ms*.000035+i*1.7)*.22),y=H*(.37+i*.073);ctx.globalAlpha=.035+i*.004;ctx.fillStyle='#d5ddd9';ctx.beginPath();ctx.ellipse(x,y,W*(.22+i*.025),H*.018,0,0,7);ctx.fill()}ctx.restore();ctx.filter='none';
 }
 if(type==='rain'){
  ctx.strokeStyle='rgba(215,222,223,.13)';ctx.lineWidth=.65;
  for(const p of particles){let x=((p.x*W+ms*.035*p.z)%(W+50))-25,y=((p.y*H+ms*.09*p.s)%(H+50))-25;ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x-4,y+15*p.z);ctx.stroke()}
 }
 if(type==='petals'){
  for(const p of particles){let x=(p.x*W+ms*.009*p.s)%W,y=(p.y*H+ms*.014*p.s)%H;ctx.save();ctx.translate(x,y);ctx.rotate(p.p+ms*.0002);ctx.fillStyle='rgba(222,178,103,.34)';ctx.beginPath();ctx.ellipse(0,0,3.2*p.z,1.35*p.z,0,0,7);ctx.fill();ctx.restore()}
 }
 if(type==='reeds'){
  ctx.save();ctx.filter='blur(.7px)';
  for(const p of particles){let x=p.x*W,y=H*(.8+p.z*.13),h=H*(.12+p.s*.12),sw=Math.sin(ms*.0005+p.p)*9*p.z;ctx.strokeStyle='rgba(34,37,31,.34)';ctx.lineWidth=.8+p.z*.45;ctx.beginPath();ctx.moveTo(x,y);ctx.quadraticCurveTo(x+sw*.35,y-h*.55,x+sw,y-h);ctx.stroke()}ctx.restore();
 }
 if(type==='willow'){
  ctx.save();ctx.filter='blur(1px)';ctx.strokeStyle='rgba(6,9,7,.48)';ctx.lineWidth=1.3;
  for(let i=0;i<29;i++){let x=W*(.77+i*.007);ctx.beginPath();ctx.moveTo(x,-10);ctx.quadraticCurveTo(x-35,H*.24,x-18+Math.sin(ms*.0005+i)*7,H*(.48+(i%5)*.035));ctx.stroke()}ctx.restore();
 }
}
function createEnv(){
 const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;
 const ac=new AC(),gain=ac.createGain(),filter=ac.createBiquadFilter(),src=ac.createBufferSource();
 const b=ac.createBuffer(1,ac.sampleRate*2,ac.sampleRate),d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*(.55+.45*Math.sin(i*.00013));
 src.buffer=b;src.loop=true;filter.type='lowpass';filter.frequency.value=560;gain.gain.value=.012;src.connect(filter).connect(gain).connect(ac.destination);src.start();env={ac,gain}
}
function soundtrack(t){
 let v=.21;if(t>25&&t<36)v=.25;if(t>36&&t<48)v=.18;if(t>52)v=.13;if(t>59)v=.08;
 score.volume=muted?0:v;voice.volume=muted?0:1;if(env)env.gain.gain.setTargetAtTime(muted?0:.012,env.ac.currentTime,.18);
}
function frame(ms){
 drawFX(ms);
 if(started&&!ended){
  const t=voice.currentTime;
  switchScene(sceneAt(t));captionAt(t);soundtrack(t);
  progress.style.width=Math.min(100,t/61.5445*100)+'%';
  if(t>54.3)seal.style.opacity=1;
 }
 requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

async function preload(){
 const imgs=sceneFiles.map(src=>new Promise(res=>{const i=new Image();i.onload=()=>res(true);i.onerror=()=>res(false);i.src=src}));
 const ok=await Promise.all(imgs);
 if(ok.every(Boolean)){loadState.textContent='场景已就绪';enter.disabled=false}else{loadState.textContent='部分场景加载失败 · 可继续播放';enter.disabled=false}
}
preload();

async function startFilm(){
 if(started)return;started=true;ended=false;currentScene=-1;currentCaption=-1;seal.style.opacity=0;fade.style.opacity=0;replay.classList.remove('show');
 createEnv();voice.currentTime=0;score.currentTime=0;
 intro.style.opacity=0;setTimeout(()=>intro.style.display='none',1400);
 try{await score.play();await voice.play()}catch(e){voice.play().catch(()=>{});score.play().catch(()=>{})}
}
enter.onclick=startFilm;
sound.onclick=()=>{muted=!muted;sound.textContent=muted?'声音关闭':'声音开启';voice.muted=muted;score.muted=muted;if(env)env.gain.gain.setTargetAtTime(muted?0:.012,env.ac.currentTime,.2)};
voice.onended=()=>{ended=true;sub.classList.remove('show');progress.style.width='100%';score.volume=.06;setTimeout(()=>{fade.style.opacity=.5;replay.classList.add('show')},2800)};
replay.onclick=()=>{ended=false;started=true;currentScene=-1;currentCaption=-1;fade.style.opacity=0;seal.style.opacity=0;replay.classList.remove('show');voice.currentTime=0;score.currentTime=0;score.play().catch(()=>{});voice.play().catch(()=>{})};
</script>
</body>
</html>
