<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#030506">
<title>少年游 · 唐多令</title>
<link rel="preload" as="image" href="assets/scenes/scene01_river.webp">
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#020304;color:#eee;font-family:"Songti SC","STSong","Noto Serif SC",serif}
body{touch-action:manipulation}
#world{position:fixed;inset:0;width:100%;height:100%;display:block;background:#050708}
.fx{position:fixed;inset:0;pointer-events:none}
#grain{z-index:5;opacity:.072;mix-blend-mode:soft-light;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.92' numOctaves='4' seed='9' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.9'/%3E%3C/svg%3E")}
#vignette{z-index:6;background:radial-gradient(ellipse at 50% 47%,transparent 20%,rgba(0,0,0,.16) 57%,rgba(0,0,0,.82) 126%)}
#letterbox{z-index:7;background:linear-gradient(#000 0 5.2vh,transparent 5.2vh calc(100% - 5.2vh),#000 calc(100% - 5.2vh))}
#ink{z-index:8;opacity:0;filter:blur(14px);transition:opacity .9s ease;background:radial-gradient(ellipse at 20% 58%,#000 0 14%,transparent 35%),radial-gradient(ellipse at 78% 42%,#000 0 16%,transparent 39%),radial-gradient(ellipse at 49% 50%,rgba(0,0,0,.94) 0 20%,transparent 58%)}
#intro{position:fixed;inset:0;z-index:30;display:grid;place-items:center;background:radial-gradient(circle at 50% 36%,#24302f 0,#101617 34%,#040607 76%);transition:opacity 1.8s}
.introbox{text-align:center;padding:24px}
.kicker{font-size:11px;letter-spacing:.52em;color:#a58f69;margin-bottom:25px}
h1{font-size:clamp(52px,9vw,102px);font-weight:400;letter-spacing:.23em;margin:0 -.23em 0 0;text-shadow:0 8px 42px #000}
.sub{font-size:12px;letter-spacing:.48em;color:#a9aaa4;margin-top:17px}
.enter{margin-top:54px;padding:13px 30px;border-radius:99px;border:1px solid rgba(220,206,174,.35);background:rgba(255,255,255,.025);color:#ded4bd;letter-spacing:.28em;cursor:pointer;backdrop-filter:blur(10px)}
#loading{height:14px;margin-top:18px;color:rgba(213,204,184,.45);font:9px -apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif;letter-spacing:.18em}
#copy{position:fixed;inset:0;z-index:13;pointer-events:none}
.caption{position:absolute;opacity:0;filter:blur(5px);transition:opacity 1.45s ease,filter 1.45s ease,transform 1.45s ease;text-shadow:0 4px 30px #000,0 1px 6px #000}
.caption.show{opacity:1;filter:none}
.center{left:50%;top:50%;width:min(88vw,980px);text-align:center;transform:translate(-50%,-43%)}
.center.show{transform:translate(-50%,-50%)}
.left{left:8vw;top:22vh;width:min(74vw,800px);transform:translateY(12px)}
.left.show{transform:none}
.right{right:8vw;top:20vh;width:min(72vw,760px);text-align:right;transform:translateY(12px)}
.right.show{transform:none}
.poem{font-size:clamp(31px,5vw,62px);line-height:1.78;letter-spacing:.18em;color:#e7dfcd}
.narration{font-size:clamp(18px,2.3vw,29px);line-height:2.08;letter-spacing:.12em;color:#d7d0c1}
.whisper{display:block;margin-top:16px;font-size:clamp(11px,1.05vw,14px);letter-spacing:.31em;color:#9a9487}
.vertical{writing-mode:vertical-rl;text-orientation:mixed;line-height:1.95;letter-spacing:.26em}
#chapter{position:fixed;z-index:14;left:28px;bottom:8vh;color:rgba(222,213,194,.48);font:10px/1.4 -apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif;letter-spacing:.23em;writing-mode:vertical-rl;transition:opacity .8s}
#sound{position:fixed;z-index:16;right:25px;top:7vh;border:0;background:transparent;color:rgba(226,220,205,.52);font:10px -apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif;letter-spacing:.16em;cursor:pointer}
#progress{position:fixed;z-index:17;left:0;bottom:0;height:1px;width:0;background:linear-gradient(90deg,#5c4a31,#d4bb83);box-shadow:0 0 14px rgba(201,177,120,.4);transition:width .18s linear}
#seal{position:fixed;z-index:15;right:7vw;bottom:9vh;opacity:0;transition:opacity 2.7s;border:1px solid rgba(160,54,42,.8);color:#b64e40;padding:8px 6px 5px;font-size:12px;letter-spacing:.13em;writing-mode:vertical-rl;background:rgba(30,7,5,.14)}
@media(max-width:640px){
#letterbox{background:linear-gradient(#000 0 3.3vh,transparent 3.3vh calc(100% - 3.3vh),#000 calc(100% - 3.3vh))}
.center{width:90vw}.left{left:7vw;top:20vh;width:86vw}.right{right:6vw;top:19vh;width:86vw}
.poem{font-size:clamp(29px,8vw,44px);line-height:1.9}.narration{font-size:17px;line-height:2.12}
#chapter{left:13px;bottom:6.3vh}#sound{right:14px;top:4.8vh}
}
</style>
</head>
<body>
<canvas id="world"></canvas>
<div id="grain" class="fx"></div><div id="vignette" class="fx"></div><div id="letterbox" class="fx"></div><div id="ink" class="fx"></div>
<div id="intro"><div class="introbox"><div class="kicker">南宋 · 刘过</div><h1>少年游</h1><div class="sub">唐多令 · 芦叶满汀洲</div><button id="enter" class="enter">入 画</button><div id="loading">电影场景载入中</div></div></div>
<div id="copy"><div id="caption" class="caption"></div></div>
<div id="chapter">江上初见</div><button id="sound">声音开启</button><div id="progress"></div><div id="seal">少年游</div>
<script>
const cv=document.querySelector('#world'),ctx=cv.getContext('2d'),caption=document.querySelector('#caption'),intro=document.querySelector('#intro'),ink=document.querySelector('#ink'),chapter=document.querySelector('#chapter'),soundBtn=document.querySelector('#sound'),progress=document.querySelector('#progress'),seal=document.querySelector('#seal'),loading=document.querySelector('#loading');
let W,H,D,started=false,muted=false,audioCtx=null,ambGain=null,currentVoice=null,currentSegment=-1,currentShot=0,previousShot=null,shotStarted=performance.now(),transitionStarted=0,transitionMs=1350,timers=[];
const clamp=(v,a=0,b=1)=>Math.max(a,Math.min(b,v)),lerp=(a,b,t)=>a+(b-a)*t,ease=t=>t*t*(3-2*t),rand=(a,b)=>a+Math.random()*(b-a);
function resize(){W=innerWidth;H=innerHeight;D=Math.min(devicePixelRatio||1,2);cv.width=W*D;cv.height=H*D;ctx.setTransform(D,0,0,D,0,0)}addEventListener('resize',resize);resize();

const sceneFiles=['scene01_river.webp','scene02_tower.webp','scene03_mooring.webp','scene04_ruin.webp','scene05_memory.webp','scene06_wine.webp','scene07_departure.webp'];
const plates=sceneFiles.map(n=>{const im=new Image();im.decoding='async';im.src='assets/scenes/'+n;return im});
Promise.all(plates.map(im=>im.decode().catch(()=>{}))).then(()=>{loading.textContent='场景已就绪'});

const shots=[
 {title:'江上初见',img:0,s0:1.095,s1:1.035,x0:-.025,x1:.018,y0:.015,y1:-.006,t:13,grade:'cold',fx:'mist'},
 {title:'芦洲寒水',img:0,s0:1.16,s1:1.10,x0:-.045,x1:.026,y0:.085,y1:.035,t:8,grade:'cold',fx:'reeds'},
 {title:'重过南楼',img:1,s0:1.08,s1:1.15,x0:-.055,x1:.018,y0:.015,y1:-.012,t:9,grade:'neutral',fx:'rain'},
 {title:'柳下系舟',img:2,s0:1.11,s1:1.055,x0:-.035,x1:.026,y0:.01,y1:-.008,t:10,grade:'cold',fx:'willow'},
 {title:'旧梦回潮',img:4,s0:1.07,s1:1.13,x0:.025,x1:-.018,y0:.012,y1:-.01,t:16,grade:'warm',fx:'memory'},
 {title:'黄鹤断矶',img:3,s0:1.08,s1:1.035,x0:-.035,x1:.018,y0:.015,y1:-.005,t:12,grade:'cold',fx:'rain'},
 {title:'旧江山',img:3,s0:1.18,s1:1.10,x0:.05,x1:-.04,y0:.035,y1:.005,t:11,grade:'cold',fx:'mist'},
 {title:'桂花载酒',img:5,s0:1.085,s1:1.13,x0:-.018,x1:.024,y0:.01,y1:-.015,t:12,grade:'warm',fx:'petals'},
 {title:'终不似',img:6,s0:1.12,s1:1.07,x0:.018,x1:-.018,y0:.018,y1:0,t:8,grade:'cold',fx:'ghost'},
 {title:'少年游',img:6,s0:1.06,s1:1.0,x0:-.012,x1:.012,y0:.005,y1:-.01,t:12,grade:'cold',fx:'mist'},
 {title:'余音',img:6,s0:1.02,s1:.97,x0:.006,x1:-.006,y0:0,y1:-.015,t:18,grade:'cold',fx:'after'}
];

const segments=[
 {file:'01_twenty_years.mp3',shot:0,rate:.94,gap:1.25,cls:'left narration',html:'二十年……<br>可以改变多少事。'},
 {file:'02_river.mp3',shot:0,rate:.95,gap:1.25,cls:'left narration',html:'一个人，从少年走到暮色。<br>一座城，换了人间。<span class="whisper">可江水……仍旧这样流。</span>'},
 {file:'03_reeds.mp3',shot:1,rate:.94,gap:1.15,cls:'center poem',html:'芦叶满汀洲，<br>寒沙带浅流。'},
 {file:'04_south_tower.mp3',shot:2,rate:.93,gap:1.35,cls:'right poem vertical',html:'二十年重过南楼。'},
 {file:'05_willow.mp3',shot:3,rate:.94,gap:1.3,cls:'center poem',html:'柳下系船犹未稳，<br>能几日，又中秋。'},
 {file:'06_return.mp3',shot:4,rate:.95,gap:1.15,cls:'left narration',html:'我们总以为，回到旧地，<br>就能把从前，也一并找回来。'},
 {file:'07_truth.mp3',shot:4,rate:.94,gap:1.5,cls:'right narration',html:'后来才知道——<br>故地，可以重游。<span class="whisper">故人……却未必还在。</span>'},
 {file:'08_rock.mp3',shot:5,rate:.93,gap:1.0,cls:'left poem vertical',html:'黄鹤断矶头。'},
 {file:'09_oldfriend.mp3',shot:5,rate:.91,gap:1.55,cls:'center poem',html:'故人……今在否？'},
 {file:'10_new_sorrow.mp3',shot:6,rate:.94,gap:1.3,cls:'right poem vertical',html:'旧江山浑是新愁。'},
 {file:'11_wine.mp3',shot:7,rate:.93,gap:1.7,cls:'center poem',html:'欲买桂花同载酒。'},
 {file:'12_not_same.mp3',shot:8,rate:.89,gap:2.1,cls:'center poem',html:'终不似……'},
 {file:'13_youth.mp3',shot:9,rate:.88,gap:2.5,cls:'center poem',html:'少年游。'},
 {file:'14_epilogue.mp3',shot:10,rate:.94,gap:4.0,cls:'center narration',html:'场景还在。<br>人生……却早已走远了。'}
];
const voices=segments.map(s=>{const a=new Audio('assets/audio/'+s.file);a.preload='auto';a.playsInline=true;a.preservesPitch=true;a.volume=.98;return a});
const music={intro:new Audio('assets/audio/bgm_intro.mp3'),memory:new Audio('assets/audio/bgm_memory.mp3'),rise:new Audio('assets/audio/bgm_rise.mp3')};
Object.values(music).forEach(a=>{a.preload='auto';a.loop=true;a.volume=0});

const mist=Array.from({length:9},(_,i)=>({y:.39+i*.055,w:.2+i*.035,p:rand(0,6.28),s:rand(.65,1.25)}));
const reeds=Array.from({length:95},()=>({x:Math.random(),h:rand(.11,.34),p:rand(0,6.28),a:rand(.1,.34),d:rand(.7,1.5)}));
const petals=Array.from({length:36},()=>({x:Math.random(),y:Math.random(),p:rand(0,6.28),s:rand(.65,1.45)}));
const rain=Array.from({length:115},(_,i)=>({x:(i*83)%997/997,y:(i*47)%991/991,l:rand(10,18)}));

function coverRect(im,scale,px,py){
 const iw=im.naturalWidth||1600,ih=im.naturalHeight||900,base=Math.max(W/iw,H/ih)*scale,dw=iw*base,dh=ih*base;
 const x=(W-dw)/2+px*W,y=(H-dh)/2+py*H; return [x,y,dw,dh];
}
function drawPlate(shot,alpha=1,elapsed=0){
 const im=plates[shot.img]; if(!im||!im.complete)return;
 const q=ease(clamp(elapsed/(shot.t*1000))),sc=lerp(shot.s0,shot.s1,q),px=lerp(shot.x0,shot.x1,q),py=lerp(shot.y0,shot.y1,q);
 const r=coverRect(im,sc,px,py);ctx.save();ctx.globalAlpha=alpha;ctx.drawImage(im,...r);ctx.restore();
}
function grade(kind,alpha=1){
 ctx.save();ctx.globalAlpha=alpha;
 if(kind==='warm'){let g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'rgba(101,47,18,.10)');g.addColorStop(.58,'rgba(210,122,45,.08)');g.addColorStop(1,'rgba(24,8,3,.14)');ctx.fillStyle=g}
 else if(kind==='neutral'){ctx.fillStyle='rgba(4,12,15,.08)'}
 else{let g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'rgba(3,19,31,.13)');g.addColorStop(.6,'rgba(5,18,25,.06)');g.addColorStop(1,'rgba(0,4,7,.16)');ctx.fillStyle=g}
 ctx.fillRect(0,0,W,H);ctx.restore();
}
function drawMist(ms,a=.16){ctx.save();ctx.globalCompositeOperation='screen';mist.forEach((m,i)=>{let x=W*(.5+Math.sin(ms*.000035*m.s+m.p)*.18),y=H*m.y;ctx.globalAlpha=a*(.42+i*.035);ctx.filter='blur('+(16+i*2)+'px)';ctx.fillStyle='#cbd4d0';ctx.beginPath();ctx.ellipse(x,y,W*m.w,H*.018,0,0,7);ctx.fill()});ctx.restore();ctx.filter='none'}
function drawReeds(ms){ctx.save();ctx.filter='blur(1px)';reeds.forEach(r=>{let x=r.x*W,y=H*(.83+r.d*.11),h=r.h*H,sw=Math.sin(ms*.00045+r.p)*13*r.d;ctx.strokeStyle='rgba(31,35,31,'+(r.a+.16)+')';ctx.lineWidth=1+r.d*.6;ctx.beginPath();ctx.moveTo(x,y);ctx.quadraticCurveTo(x+sw*.35,y-h*.52,x+sw,y-h);ctx.stroke();ctx.fillStyle='rgba(110,101,77,'+(r.a+.08)+')';ctx.beginPath();ctx.ellipse(x+sw,y-h,10*r.d,2.1*r.d,-.24,0,7);ctx.fill()});ctx.restore()}
function drawWillow(ms){ctx.save();ctx.filter='blur(1.4px)';ctx.strokeStyle='rgba(8,12,10,.84)';ctx.lineCap='round';ctx.lineWidth=10;ctx.beginPath();ctx.moveTo(W*.94,-20);ctx.bezierCurveTo(W*.83,H*.14,W*.88,H*.31,W*.76,H*.57);ctx.stroke();ctx.lineWidth=1.35;for(let i=0;i<34;i++){let sx=W*(.79+i*.006),sy=H*(.02+(i%7)*.023);ctx.beginPath();ctx.moveTo(sx,sy);ctx.quadraticCurveTo(sx-30,H*.29,sx-20+Math.sin(ms*.0006+i)*9,H*(.53+(i%4)*.03));ctx.stroke()}ctx.restore()}
function drawRain(ms,a=.11){ctx.save();ctx.strokeStyle='rgba(216,224,225,'+a+')';ctx.lineWidth=.7;rain.forEach((r,i)=>{let x=((r.x*W+ms*.028*(1+i%3))%(W+80))-40,y=((r.y*H+ms*.075*(1+i%2))%(H+40))-20;ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x-4,y+r.l);ctx.stroke()});ctx.restore()}
function drawPetals(ms,a=.55){ctx.save();petals.forEach(p=>{let x=(p.x*W+ms*.008*p.s)%W,y=(p.y*H+ms*.013*p.s)%H;ctx.translate(x,y);ctx.rotate(p.p+ms*.00015);ctx.fillStyle='rgba(226,181,97,'+(a*.62)+')';ctx.beginPath();ctx.ellipse(0,0,3.4*p.s,1.6*p.s,0,0,7);ctx.fill();ctx.setTransform(D,0,0,D,0,0)});ctx.restore()}
function drawGhost(ms){ctx.save();let a=.045+.02*Math.sin(ms*.0012);ctx.globalCompositeOperation='screen';ctx.globalAlpha=a;let g=ctx.createRadialGradient(W*.62,H*.47,0,W*.62,H*.47,W*.18);g.addColorStop(0,'rgba(208,142,83,.8)');g.addColorStop(1,'rgba(208,142,83,0)');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);ctx.restore()}
function fxFor(shot,ms){
 if(['mist','after','memory'].includes(shot.fx))drawMist(ms,shot.fx==='after'?.12:.15);
 if(shot.fx==='reeds')drawReeds(ms);
 if(shot.fx==='willow')drawWillow(ms);
 if(shot.fx==='rain')drawRain(ms,.10);
 if(shot.fx==='petals'){drawMist(ms,.08);drawPetals(ms,.62)}
 if(shot.fx==='memory'){drawPetals(ms,.23)}
 if(shot.fx==='ghost'){drawMist(ms,.18);drawGhost(ms)}
 if(shot.fx==='after'){ctx.fillStyle='rgba(0,0,0,.22)';ctx.fillRect(0,0,W,H)}
}
function render(ms){
 let elapsed=ms-shotStarted,shot=shots[currentShot],fade=transitionStarted?clamp((ms-transitionStarted)/transitionMs):1;
 ctx.clearRect(0,0,W,H);
 if(previousShot&&fade<1){drawPlate(previousShot,1-fade,elapsed);grade(previousShot.grade,1-fade)}
 drawPlate(shot,fade,elapsed);grade(shot.grade,fade);fxFor(shot,ms);
 if(fade>=1){previousShot=null;transitionStarted=0}
 requestAnimationFrame(render)
}
requestAnimationFrame(render);

function showCaption(i){caption.classList.remove('show');setTimeout(()=>{caption.className='caption '+segments[i].cls;caption.innerHTML=segments[i].html;requestAnimationFrame(()=>caption.classList.add('show'))},250)}
function setShot(i){
 if(i===currentShot&&currentSegment>=0)return;
 previousShot=shots[currentShot];currentShot=i;shotStarted=performance.now();transitionStarted=performance.now();
 ink.style.opacity=.68;setTimeout(()=>ink.style.opacity=0,620);
 chapter.style.opacity=0;setTimeout(()=>{chapter.textContent=shots[i].title;chapter.style.opacity=.72},430);
 if(i===9)seal.style.opacity=1;
 if(i===2)chime();
}
function segmentProgress(){
 if(currentSegment<0)return 0;
 let v=voices[currentSegment],local=(v.duration&&isFinite(v.duration))?clamp(v.currentTime/v.duration):0;
 return (currentSegment+local)/segments.length*100;
}
function schedule(fn,ms){let id=setTimeout(fn,ms);timers.push(id);return id}
function startSegment(i){
 if(!started||i>=segments.length){finishStory();return}
 currentSegment=i;setShot(segments[i].shot);showCaption(i);
 const v=voices[i];currentVoice=v;v.currentTime=0;v.playbackRate=segments[i].rate;v.volume=muted?0:.98;v.muted=muted;
 v.onended=()=>{currentVoice=null;caption.classList.remove('show');progress.style.width=((i+1)/segments.length*100)+'%';schedule(()=>startSegment(i+1),segments[i].gap*1000)};
 v.onerror=()=>{currentVoice=null;schedule(()=>startSegment(i+1),900)};
 v.play().catch(()=>{currentVoice=null;schedule(()=>startSegment(i+1),1000)});
}
function finishStory(){currentSegment=segments.length;progress.style.width='100%';caption.classList.remove('show');schedule(()=>{seal.style.opacity=1},800)}
function ambient(){
 audioCtx=new(window.AudioContext||window.webkitAudioContext)();ambGain=audioCtx.createGain();ambGain.gain.value=.035;ambGain.connect(audioCtx.destination);
 let b=audioCtx.createBuffer(1,audioCtx.sampleRate*3,audioCtx.sampleRate),d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
 let n=audioCtx.createBufferSource(),f=audioCtx.createBiquadFilter();n.buffer=b;n.loop=true;f.type='lowpass';f.frequency.value=430;n.connect(f).connect(ambGain);n.start()
}
function chime(){if(!audioCtx||muted)return;let o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type='sine';o.frequency.value=392;g.gain.setValueAtTime(.0001,audioCtx.currentTime);g.gain.exponentialRampToValueAtTime(.035,audioCtx.currentTime+.05);g.gain.exponentialRampToValueAtTime(.0001,audioCtx.currentTime+4);o.connect(g).connect(audioCtx.destination);o.start();o.stop(audioCtx.currentTime+4.1)}
function mixMusic(){
 if(!started)return;
 let duck=(currentVoice && !currentVoice.paused) ? .42 : 1,i=currentSegment;
 let intro=.13,memory=.0,rise=.0;
 if(i>=5){intro=.07;memory=.095}
 if(i>=7){intro=.045;memory=.075;rise=.07}
 if(i>=11){intro=.018;memory=.02;rise=.025}
 if(i>=12){intro=.01;memory=.008;rise=.01}
 if(i>=13){intro=.022;memory=0;rise=0}
 music.intro.volume=muted?0:intro*duck;music.memory.volume=muted?0:memory*duck;music.rise.volume=muted?0:rise*duck;
 if(ambGain&&audioCtx)ambGain.gain.setTargetAtTime(muted?0:(i>=11?.017:.035),audioCtx.currentTime,.2);
 progress.style.width=segmentProgress()+'%';requestAnimationFrame(mixMusic)
}
document.querySelector('#enter').onclick=()=>{
 if(started)return;started=true;intro.style.opacity=0;setTimeout(()=>intro.remove(),1850);ambient();
 music.intro.currentTime=0;music.memory.currentTime=0;music.rise.currentTime=0;
 music.intro.play().catch(()=>{});music.memory.play().catch(()=>{});music.rise.play().catch(()=>{});
 requestAnimationFrame(mixMusic);schedule(()=>startSegment(0),700)
};
soundBtn.onclick=()=>{
 muted=!muted;soundBtn.textContent=muted?'声音关闭':'声音开启';voices.forEach(v=>v.muted=muted);Object.values(music).forEach(v=>v.muted=muted);
 if(ambGain&&audioCtx)ambGain.gain.setTargetAtTime(muted?0:.035,audioCtx.currentTime,.2)
};
</script>
</body>
</html>
