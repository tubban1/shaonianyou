<style>

.poem{font-size:clamp(29px,8.1vw,44px);line-height:1.86}.narration{font-size:17px;line-height:2.08}
#chapter{left:13px;bottom:6vh}#sound{right:14px;top:4.6vh}
}
</style>
</head>
<body>
<canvas id="world"></canvas>
<div id="grade"></div><div id="grain"></div><div id="vignette"></div><div id="letterbox"></div><div id="ink"></div>
<div id="intro"><div class="intro-wrap"><div class="kicker">南宋 · 刘过</div><h1>少年游</h1><div class="sub">唐多令 · 芦叶满汀洲</div><button class="enter" id="enter">入 画</button></div></div>

function palette(t){const warm=bell(t,42,9)*.72;const cold=clamp((t-49)/16)*.5;return {warm,cold}}

function chime(){if(!audioCtx||muted)return;let o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type='sine';o.frequency.value=392;g.gain.setValueAtTime(.0001,audioCtx.currentTime);g.gain.exponentialRampToValueAtTime(.05,audioCtx.currentTime+.04);g.gain.exponentialRampToValueAtTime(.0001,audioCtx.currentTime+4.5);o.connect(g).connect(audioCtx.destination);o.start();o.stop(audioCtx.currentTime+4.6)}
let riseStarted=false;
function musicMix(t){if(!started)return;let duck=anyVoicePlaying()?.48:1;let vi=.17*duck,vm=.14*duck,vr=.12*duck;let iVol=vi*(1-smooth(28,39,t));let mVol=vm*smooth(29,37,t)*(1-smooth(59,69,t));if(t>=55&&!riseStarted){riseStarted=true;music.rise.currentTime=0;music.rise.play().catch(()=>{})}let rVol=vr*smooth(55,66,t)*(1-smooth(82,89,t));if(t>81){iVol*=.18;mVol*=.18;rVol*=.28}if(t>88){iVol*=.07;mVol*=.07;rVol*=.08}if(t>100){iVol=.035*duck;mVol=0;rVol=0}music.intro.volume=muted?0:clamp(iVol);music.memory.volume=muted?0:clamp(mVol);music.rise.volume=muted?0:clamp(rVol);if(ambGain&&audioCtx)ambGain.gain.setTargetAtTime(muted?0:(t>88?.025:.05),audioCtx.currentTime,.25)}
const duration=112;
function tick(ms){if(!started)return;let t=(ms-t0)/1000;progress.style.width=Math.min(100,t/duration*100)+'%';let ci=0;for(let i=0;i<captions.length;i++)if(t>=captions[i][0])ci=i;if(ci!==lastCaption){lastCaption=ci;showCaption(ci)}let vi=-1;for(let i=0;i<voiceTimes.length;i++)if(t>=voiceTimes[i])vi=i;if(vi!==lastVoice){lastVoice=vi;playVoice(vi)}let si=sceneno(t);if(si!==lastScene){lastScene=si;sceneTransition(si)}musicMix(t);if(t<duration)requestAnimationFrame(tick)}
document.querySelector('#enter').onclick=()=>{started=true;t0=performance.now();intro.style.opacity=0;setTimeout(()=>intro.remove(),1850);setupAmbient();music.intro.currentTime=0;music.memory.currentTime=0;music.intro.play().catch(()=>{});music.memory.play().catch(()=>{});requestAnimationFrame(tick)};
soundBtn.onclick=()=>{muted=!muted;soundBtn.textContent=muted?'声音关闭':'声音开启';voices.forEach(v=>v.muted=muted);Object.values(music).forEach(v=>v.muted=muted);if(ambGain&&audioCtx)ambGain.gain.setTargetAtTime(muted?0:.05,audioCtx.currentTime,.2)};
</script>
